<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【S】シフトアプリ│サクラG</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#5FD0A0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="【S】シフトアプリ">
<style>
  :root{--mint:#A7E8C8;--mint-deep:#5FD0A0;--pink:#FFC9DD;--pink-deep:#FF9EC0;--text:#4A5560;--text2:#9CAAB5;--line:#E4F4EC;--shadow:rgba(95,208,160,.18);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
    background:radial-gradient(circle at 15% 10%,#FFE4F0 0%,transparent 30%),radial-gradient(circle at 85% 15%,#DCF3FF 0%,transparent 28%),linear-gradient(170deg,#F0FBF4,#F6FBFF);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;border-radius:24px;padding:36px 30px;width:100%;max-width:380px;box-shadow:0 12px 48px var(--shadow);border:2px solid var(--line);}
  .logo{width:56px;height:56px;border-radius:50% 50% 50% 18px;background:linear-gradient(135deg,var(--mint),var(--mint-deep));display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;box-shadow:0 6px 20px rgba(95,208,160,.4);}
  h1{text-align:center;font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text);}
  .sub{text-align:center;font-size:13px;color:var(--text2);margin-bottom:28px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:800;color:var(--text2);margin-bottom:6px;}
  select,input{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);font-family:inherit;font-size:15px;color:var(--text);background:#F8FBF9;transition:border .15s;}
  select:focus,input:focus{outline:none;border-color:var(--mint-deep);}
  .pw-wrap{position:relative;}
  .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--text2);}
  .btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--mint),var(--mint-deep));color:#fff;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;margin-top:8px;box-shadow:0 4px 16px rgba(95,208,160,.35);transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .err{color:#E05260;font-size:13px;font-weight:700;text-align:center;margin-top:10px;display:none;}
  .loading{display:none;text-align:center;color:var(--text2);font-size:13px;margin-top:10px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #D9F0E5;border-top-color:var(--mint-deep);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/session_guard.js"></script><!-- 退勤時刻で自動ログアウト -->
<script src="shift_db.js"></script>
</head>
<body>
<div class="card">
  <div class="logo">🌸</div>
  <h1>サクラシフト</h1>
  <div class="sub">内勤スタッフ</div>

  <!-- ★ 内勤はポータルからだけ入れる（パスワードでのログインは廃止） -->
  <div class="loading" id="loading" style="display:block"><span class="spinner"></span>ポータルから入っています…</div>
  <div class="err" id="errMsg"></div>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbyvlg5JbvPsqxkdvztwRXYBqPkvWjknicwfm2ksTlIxIQ-7N1zd72cn09c6oSNIkIxw/exec';
const TOKEN='sakura2025shift';

/* ★ 内勤はポータルからだけ入れる（2026/10 パスワードでのログインは廃止）
   ポータルは「index.html#portalSso=…&operator=名前」で開く。
   # 以降はサーバーに送られない。読んだらすぐURLから消す（履歴・共有で漏れないように）。
   入れたら、このブラウザに「ポータルでログインしてから20時間」だけ覚えておき、
   その間は通行証の確認を省いてすぐ開く（2回目以降を速くする）。 */
const PORTAL_KEY='portalStaffSession';   // {session, name, expiresAt}

function loadPortalSession(){
  try{
    const s=JSON.parse(localStorage.getItem(PORTAL_KEY)||'null');
    if(s && s.session && s.name && Number(s.expiresAt)>Date.now()) return s;
  }catch(e){}
  try{ localStorage.removeItem(PORTAL_KEY); }catch(e){}
  return null;
}

function showPortalOnly(msg){
  document.getElementById('loading').style.display='none';
  const err=document.getElementById('errMsg');
  err.textContent=msg||'ポータルから開いてください';
  err.style.display='block';
}

function go(s){
  localStorage.setItem('lastStaffName',s.name);
  sessionStorage.setItem('staffSession',s.session);
  sessionStorage.setItem('staffName',s.name);
  sessionStorage.setItem('staffAuth','1');
  location.replace('staff.html?name='+encodeURIComponent(s.name));
}

/* ★ 2026/10 Supabase に引っ越し
   ポータルと同じ場所（sakuramoong-app.github.io）にあるので、ポータルのログインをそのまま使う。
   通行証（#portalSso=…）はもう使わない（読んだら捨てる）。担当者の名前だけ受け取る。 */
(async()=>{
  let operator='';
  if(location.hash.indexOf('portalSso=')>=0 || location.hash.indexOf('operator=')>=0){
    const hp=new URLSearchParams(location.hash.slice(1));
    operator=hp.get('operator')||'';
    history.replaceState(null,'',location.pathname+location.search);
  }
  if(!operator){ try{ operator=localStorage.getItem('currentOperator')||''; }catch(e){} }

  // ログアウト・期限切れで戻ってきたときの案内
  const q=new URLSearchParams(location.search);
  const reason=q.get('reason')==='expired'
    ? 'ポータルでログインしてから20時間たったので、ログアウトしました。ポータルから開き直してください'
    : '';

  // ポータルでログインしていて（20時間以内）、担当者が分かればそのまま開く
  const sbs=await ShiftDB.getSession();
  if(!sbs){
    try{ localStorage.removeItem(PORTAL_KEY); }catch(e){}
    showPortalOnly(reason);
    return;
  }
  const saved=loadPortalSession();
  const name=operator || (saved && saved.name) || '';
  if(!name){ showPortalOnly('担当者が分かりません。ポータルで担当者を選んでから開いてください'); return; }
  const s={session:'supabase', name, expiresAt:ShiftDB.sessionExpiresAt(sbs)};
  localStorage.setItem(PORTAL_KEY,JSON.stringify(s));
  go(s);
})();
</script>
</body>
</html>
