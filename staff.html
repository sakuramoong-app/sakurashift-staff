  // 「本日入力可能」で見る範囲：今日から何日先まで（全媒体共通）
  // ※媒体ごとに入力可能日数は違うが、管理を単純にして誤判定を防ぐため一律にする
  const TODAY_EDITABLE_DAYS = 28;

  async function _jumpToFirstEditable(name){
    const today = ymd(new Date());
    const todayD = new Date(); todayD.setHours(0,0,0,0);
    const curWk = weekKeyOf(today);
    const castStores = Store.getCastStores(name);
    const dayStores = ['記録簿','サクラムーン','ラナ鶯谷','ラナ錦糸町','ドレスガーデン','ピーチムーン','逆AF倶楽部','キューティー','18','極門','ヘブンラナ','ヘブンサクラ','(キュ)ぴゅあらば','(キュ)情報局','(極)ぴゅあらば','(極)情報局'].filter(m=>castStores.includes(m));

    // ★ 月をまたいで「今日〜TODAY_EDITABLE_DAYS日先」で最初の未チェック日を探す
    let targetDs=null;
    for(let i=0;i<TODAY_EDITABLE_DAYS;i++){
      const d=new Date(todayD); d.setDate(todayD.getDate()+i);
      const ds=ymd(d);
      const wk=weekKeyOf(ds);
      const w=Store.getWeek(name,wk);
      if(!w) continue;
      if(!['waiting','input_waiting','inputting','change_inputting','confirmed','change_confirmed'].includes(w.status)) continue;
      const sh=w.shifts&&w.shifts[ds];
      if((!sh||sh.start==null) && !isChangedToRest(w, ds)) continue;
      const _dsStores=isChangedToRest(w,ds)?dayStores.filter(m=>REST_DAY_STORES.includes(m)):dayStores;
      const allChecked=_dsStores.length>0&&_dsStores.every(m=>w.checks&&w.checks[ds+'_'+m]&&w.checks[ds+'_'+m].checked);
      if(!allChecked){ targetDs=ds; break; }
    }

    // ★ 未チェック日が別の月にあれば、その月へ自動で切り替えてから光らせる
    if(targetDs){
      // A方式：日付の月ではなく「その日が属する週キーの月」で判定
      // （8/1・8/2は7/27週＝7月に属するので、7月ページのまま光らせる）
      const targetYM = weekKeyOf(targetDs).slice(0,7);
      if(targetYM !== viewYM){
        viewYM = targetYM;
        const lbl=document.getElementById('staffMonthLabel');
        if(lbl){ const[y,m]=viewYM.split('-').map(Number); lbl.textContent=`${y}年 ${m}月`; }
        expandedCast = name;
        setBusy(true,'読み込み中…');
        await StaffGas.loadMonthAll(viewYM);
        setBusy(false);
        renderCastList();
        await new Promise(r=>setTimeout(r,150));
      }
    }

    const castEl = document.getElementById('cast-'+cssEscape(name));
    if(!castEl) return;

    if(targetDs){
      const targetRow=castEl.querySelector(`.check-row[data-ds="${targetDs}"]`);
      if(targetRow){
        targetRow.scrollIntoView({behavior:'smooth',block:'center'});
        targetRow.classList.add('row-spin');
        setTimeout(()=>targetRow.classList.remove('row-spin'),2400);
      }
    } else {
      // 未チェックなし→今週ブロック全体をくるくる
      const curBlock=castEl.querySelector(`.week-block[data-wk="${curWk}"]`);
      if(curBlock){
        curBlock.scrollIntoView({behavior:'smooth',block:'center'});
        curBlock.classList.add('row-spin');
        setTimeout(()=>curBlock.classList.remove('row-spin'),2400);
      } else {
        castEl.scrollIntoView({behavior:'smooth',block:'center'});
      }
    }
  }

  /* ============ キャスト一覧（アコーディオン） ============ */
  /* ⑤⑥ フィルター件数カウント */
  /* 今日に未チェックがあるか判定 */
  function _hasUncheckedToday(castName){
    // 今日〜TODAY_EDITABLE_DAYS日先までに「シフトあり＆未チェック」の日があるか
    // ★ 過去日は含めない（今日以降のみ）
    const todayD=new Date(); todayD.setHours(0,0,0,0);
    const todayStr=ymd(todayD);
    const castStores=Store.getCastStores(castName);
    const dayStores=['記録簿','サクラムーン','ラナ鶯谷','ラナ錦糸町','ドレスガーデン','ピーチムーン','逆AF倶楽部','キューティー','18','極門','ヘブンラナ','ヘブンサクラ','(キュ)ぴゅあらば','(キュ)情報局','(極)ぴゅあらば','(極)情報局'].filter(m=>castStores.includes(m));
    // ★ 店舗が0個のキャストは「チェックしようがない」ので対象外（誤判定防止）
    if(dayStores.length===0) return false;
    for(let i=0;i<TODAY_EDITABLE_DAYS;i++){
      const d=new Date(todayD); d.setDate(todayD.getDate()+i);
      const ds=ymd(d);
      // 念のため過去日を明示的にスキップ（今日以降のみ対象）
      if(ds < todayStr) continue;
      const wk=weekKeyOf(ds);
      const w=Store.getWeek(castName,wk);
      if(!w||((!w.shifts||!w.shifts[ds]||w.shifts[ds].start==null) && !isChangedToRest(w, ds))) continue;
      const _dsStores=isChangedToRest(w,ds)?dayStores.filter(m=>REST_DAY_STORES.includes(m)):dayStores;
      const allChecked=_dsStores.every(m=>w.checks&&w.checks[ds+'_'+m]&&w.checks[ds+'_'+m].checked);
      if(!allChecked) return true;
    }
    return false;
  }

  /* ★ そのキャストの「最も早い未チェック日」を返す（無ければ null）
     本日入力可能フィルターの並び替えに使用。_hasUncheckedToday と同じ判定基準。 */
  function _firstUncheckedDs(castName){
    const todayD=new Date(); todayD.setHours(0,0,0,0);
    const castStores=Store.getCastStores(castName);
    const dayStores=STORES.filter(m=>castStores.includes(m));
    if(dayStores.length===0) return null;
    for(let i=0;i<TODAY_EDITABLE_DAYS;i++){
      const d=new Date(todayD); d.setDate(todayD.getDate()+i);
      const ds=ymd(d);
      const wk=weekKeyOf(ds);
      const w=Store.getWeek(castName,wk);
      if(!w||((!w.shifts||!w.shifts[ds]||w.shifts[ds].start==null) && !isChangedToRest(w, ds))) continue;
      const _dsStores=isChangedToRest(w,ds)?dayStores.filter(m=>REST_DAY_STORES.includes(m)):dayStores;
      const allChecked=_dsStores.every(m=>w.checks&&w.checks[ds+'_'+m]&&w.checks[ds+'_'+m].checked);
      if(!allChecked) return ds;
    }
    return null;
  }

  function countFilter(f){
    const today = ymd(new Date());
    let count = 0;
    Store.getCastList().forEach(c=>{
      // ★ today は月に関係なく「今日〜28日先」で判定するので、
      //   表示中の月の週データ有無で絞り込んではいけない
      //   （8月にしか未入力が無いキャストが7月表示で消える不具合の修正）
      if(f==='today'){ if(_hasUncheckedToday(c.name)) count++; return; }
      const weeks = weeksInMonth(viewYM);
      const hit = weeks.some(wk=>{
        const w = Store.getWeek(c.name, wk);
        if(!w) return false;
        if(f==='waiting') return ['waiting','input_waiting','inputting'].includes(w.status);
        if(f==='change') return w.status==='change_requested';
        return false;
      });
      if(hit) count++;
    });
    return count;
  }

  function renderCastList(){
    const cont=document.getElementById('castContainer');
    if(!cont)return;
    const today = ymd(new Date());
    let list=[...Store.getCastList()].sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    if(searchQuery) list=list.filter(c=>c.name.includes(searchQuery));
    if(filter!=='all'){
      list=list.filter(c=>{
        // ★ today は月に関係なく判定（表示月の週データ有無で絞り込まない）
        if(filter==='today') return _hasUncheckedToday(c.name);
        const weeks=weeksInMonth(viewYM);
        return weeks.some(wk=>{
          const w=Store.getWeek(c.name,wk);
          if(!w)return false;
          if(filter==='waiting') return ['waiting','input_waiting','inputting'].includes(w.status);
          if(filter==='change') return w.status==='change_requested';
          return false;
        });
      });
      // ★ 本日入力可能：未入力が最も早い日付の順に並べる（あいうえお順より実用的）
      if(filter==='today'){
        list.sort((a,b)=>{
          const da=_firstUncheckedDs(a.name)||'9999-12-31';
          const db=_firstUncheckedDs(b.name)||'9999-12-31';
          if(da!==db) return da.localeCompare(db);
          return a.name.localeCompare(b.name,'ja');
        });
      }
    }
    if(!list.length){ cont.innerHTML='<div class="inbox-empty">該当するキャストがいません</div>'; return; }
    cont.innerHTML='';
    KANA_GROUPS.forEach(g=>{
      const groupCasts=list.filter(c=>g.chars.includes(c.name[0]));
      if(!groupCasts.length)return;
      const grp=document.createElement('div');
      grp.className='kana-group';grp.id='grp-'+g.label;
      grp.innerHTML=`<div class="kana-group-title">${g.label}行</div>`;
      groupCasts.forEach(c=>grp.appendChild(makeCastBlock(c)));
      cont.appendChild(grp);
    });
  }

  function toggleCast(name){
    expandedCast = (expandedCast===name)?null:name;
    renderCastList();
    if(expandedCast===name){
      // 変更申請中フィルターなら、変更申請のある日にジャンプ
      if(filter==='change'){
        _jumpToChangeRequest(name);
      } else {
        // 最短入力可能日が別月なら先に月切り替え
        _jumpToFirstEditableWithMonthSwitch(name);
      }
    }
  }

  // 変更申請のある最初の日にジャンプ（必要なら月切り替え）
  async function _jumpToChangeRequest(name){
    // 全月から change_requested の週を探す
    const allWeeks=[];
    for(let i=-1;i<3;i++){
      let [y,m]=viewYM.split('-').map(Number);
      m+=i; if(m<1){m+=12;y--;} if(m>12){m-=12;y++;}
      weeksInMonth(`${y}-${String(m).padStart(2,'0')}`).forEach(wk=>{ if(!allWeeks.includes(wk)) allWeeks.push(wk); });
    }
    allWeeks.sort();
    let targetDs=null;
    for(const wk of allWeeks){
      const w=Store.getWeek(name,wk);
      if(!w || w.status!=='change_requested' || !w.changeRequest) continue;
      // 変更申請のある最初の日付
      const days=Object.keys(w.changeRequest).sort();
      if(days.length>0){ targetDs=days[0]; break; }
    }
    if(!targetDs){ _jumpToFirstEditableWithMonthSwitch(name); return; }
    // 別月なら切り替え（A方式：週キーの月で判定）
    const targetYM=weekKeyOf(targetDs).slice(0,7);
    if(targetYM!==viewYM){
      viewYM=targetYM;
      const lbl=document.getElementById('staffMonthLabel');
      if(lbl){const[y,m]=viewYM.split('-').map(Number);lbl.textContent=`${y}年 ${m}月`;}
      setBusy(true,'読み込み中…');
      await StaffGas.loadMonthAll(viewYM);
      setBusy(false);
      expandedCast=name;
      renderCastList();
    }
    setTimeout(()=>{
      const castEl=document.getElementById('cast-'+cssEscape(name));
      if(!castEl) return;
      const row=castEl.querySelector(`.check-row[data-ds="${targetDs}"]`);
      if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); row.classList.add('row-spin'); setTimeout(()=>row.classList.remove('row-spin'),2000); }
      else castEl.scrollIntoView({behavior:'smooth',block:'center'});
    },140);
  }

  async function _jumpToFirstEditableWithMonthSwitch(name){
    const today = ymd(new Date());
    const weeks = [];
    for(let i=0;i<3;i++){
      let [y,m]=viewYM.split('-').map(Number);
      m+=i; if(m>12){m-=12;y++;}
      weeksInMonth(`${y}-${String(m).padStart(2,'0')}`).forEach(wk=>{
        if(!weeks.includes(wk)) weeks.push(wk);
      });
    }
    weeks.sort();
    let targetDs=null, targetWk=null;
    for(const wk of weeks){
      const w=Store.getWeek(name,wk);
      if(!w) continue;
      if(!['waiting','input_waiting','inputting','change_inputting','confirmed','change_confirmed'].includes(w.status)) continue;
      for(const ds of weekDates(wk)){
        if(ds>=today&&w.shifts[ds]){targetDs=ds;targetWk=wk;break;}
      }
      if(targetDs) break;
    }
    if(!targetDs){ setTimeout(()=>_jumpToFirstEditable(name),120); return; }
    // 別月なら切り替え（A方式：週キーの月で判定）
    const targetYM=weekKeyOf(targetDs).slice(0,7);
    if(targetYM!==viewYM){
      viewYM=targetYM;
      const lbl=document.getElementById('staffMonthLabel');
      if(lbl){const[y,m]=viewYM.split('-').map(Number);lbl.textContent=`${y}年 ${m}月`;}
      setBusy(true,'読み込み中…');
      await StaffGas.loadMonthAll(viewYM);
      setBusy(false);
      expandedCast=name;
      renderCastList();
    }
    setTimeout(()=>_jumpToFirstEditable(name),120);
  }

  function makeMonthChecks(c){
    const weeks=weeksInMonth(viewYM);
    return weeks.map(wk=>makeWeekCheck(c,wk)).join('');
  }

  function makeWeekCheck(c, wk){
    const w=Store.getWeek(c.name,wk);
    const castStores=Store.getCastStores(c.name);
    const st=w?w.status:'unsubmitted';
    const ds7=weekDates(wk);
    const dows=['月','火','水','木','金','土','日'];

    const ROW1=['記録簿','サクラムーン','ラナ鶯谷','ラナ錦糸町','ドレスガーデン','ピーチムーン','逆AF倶楽部','キューティー'];
    const ROW2=['18','極門','ヘブンラナ','ヘブンサクラ','(キュ)ぴゅあらば','(キュ)情報局','(極)ぴゅあらば','(極)情報局'];
    const allStores=[...ROW1,...ROW2];

    let actions='';
    const hasShift = w && w.shifts && Object.keys(w.shifts).length>0;
    if(hasShift){
      // 残り一括ボタンは日付横の一括ボタンに統合したため削除
    }
    // ★ 確認通知ボタンは waiting（提出済み・未通知）のときだけ表示する
    //   inputting（内勤入力中）は既に通知済みなので出さない
    //   （チェックを1つ入れると confirmed→inputting に落ちるため、
    //     ここに inputting を含めるとボタンが再点灯してしまう）
    if(st==='waiting'){
      actions+=`<button class="btn-sm btn-update confirm-btn metal-glow" data-confirm-wk="${wk}" onclick="StaffApp.confirmWeek('${esc(c.name)}','${wk}')">📤 キャストへ確認通知を送信</button>`;
    } else if(st==='change_requested'){
      actions+=`<button class="btn-sm btn-accept metal-glow" onclick="StaffApp.acceptChange('${esc(c.name)}','${wk}')">✅ 受理</button>
               <button class="btn-sm btn-reject metal-glow" onclick="StaffApp.rejectChange('${esc(c.name)}','${wk}')">🙅 却下</button>`;
    }

    let crInfo='';
    if(w && w.changeRequest && (st==='change_requested'||st==='change_inputting')){
      const keys=Object.keys(w.changeRequest);
      // 全日の理由を集める
      const reasons=keys.map(ds=>(w.changeRequest[ds]&&w.changeRequest[ds].reason||'').trim()).filter(Boolean);
      const uniqueReasons=[...new Set(reasons)];
      const allSame = uniqueReasons.length===1 && reasons.length===keys.length;

      const lines=keys.map(ds=>{
        const ch=w.changeRequest[ds];
        const d=new Date(ds+'T12:00:00');
        const label=ch.type==='holiday'?'お休みに変更':`${fmtShift(ch.start,ch.end)}に変更`;
        // 理由がバラバラなら各行に理由を添える
        const perReason = (!allSame && ch.reason) ? ` <span style="color:#C71585">（理由：${esc(ch.reason)}）</span>` : '';
        return `${d.getMonth()+1}/${d.getDate()}(${dows[(d.getDay()+6)%7]}) → ${label}${perReason}`;
      });
      // 全日同じ理由なら最後に1つだけまとめて表示
      const reasonLine = allSame ? `<br>📝 理由：${esc(uniqueReasons[0])}` : '';
      crInfo=`<div class="cr-info">🔄 変更希望：<br>${lines.join('<br>')}${reasonLine}</div>`;
    }

    // ★ 変更履歴（受理済み）：その週の全7日を並べて表示
    //   変更のあった日は「変更前 → 変更後（理由）」、無い日は現在のシフトのみ
    let histInfo='';
    if(w && w.changeHistory && Object.keys(w.changeHistory).length>0){
      let hCount=0;
      const acceptedBy=new Set();
      let lastAt=null;
      const hLines=ds7.map((ds,i)=>{
        const d=new Date(ds+'T12:00:00');
        const dLabel=`${d.getMonth()+1}/${d.getDate()}(${dows[i]})`;
        const dcls2=isJpHoliday(ds)?'day-sun':(i===5?'day-sat':i===6?'day-sun':'');
        const arr=(w.changeHistory[ds])||[];
        if(arr.length===0){
          // 変更なしの日：現在のシフトをそのまま表示
          const sh=w.shifts&&w.shifts[ds];
          const cur=(sh&&sh.start!=null)?fmtShift(sh.start,sh.end):'お休み';
          return `<div class="chg-day">
            <span class="chg-day-date ${dcls2}">${dLabel}</span>
            <span class="chg-day-plain">${cur}</span>
          </div>`;
        }
        // 変更ありの日：最古のbeforeと最新のafterで「元→今」を表す
        hCount+=arr.length;
        const first=arr[0], last=arr[arr.length-1];
        arr.forEach(h=>{ if(h.by) acceptedBy.add(h.by); if(h.at&&(!lastAt||h.at>lastAt)) lastAt=h.at; });
        const bef=first.before?fmtShift(first.before.start,first.before.end):'お休み';
        const isRestNow=!last.after;
        const aft=isRestNow?'お休み':fmtShift(last.after.start,last.after.end);
        const reason=last.reason||first.reason||'';
        const times=arr.length>1?`<span class="chg-day-times">×${arr.length}</span>`:'';
        return `<div class="chg-day chg-day-mod">
          <span class="chg-day-date ${dcls2}">${dLabel}</span>
          <span class="chg-day-bef">${bef}</span>
          <span class="chg-day-arrow">→</span>
          <span class="chg-day-aft ${isRestNow?'is-rest':''}">${aft}</span>
          ${isRestNow?'<span class="chg-rest-chk">☑ 休</span>':''}
          ${reason?`<span class="chg-day-reason">（${esc(reason)}）</span>`:''}
          ${times}
        </div>`;
      });
      const byLabel=[...acceptedBy].filter(Boolean).join('・');
      const atD=lastAt?new Date(lastAt):null;
      const atLabel=atD?`${atD.getMonth()+1}/${atD.getDate()} ${String(atD.getHours()).padStart(2,'0')}:${String(atD.getMinutes()).padStart(2,'0')}`:'';
      const foot=byLabel?`<div class="chg-foot">${esc(byLabel)} が受理${atLabel?`（最終 ${atLabel}）`:''}</div>`:'';
      histInfo=`<details class="chg-hist"><summary>📜 変更履歴（${hCount}件）</summary>`
        + `<div class="chg-hist-body">${hLines.join('')}${foot}</div></details>`;
    }
    crInfo = crInfo + histInfo;

    let rows='';
    const _today_check=ymd(new Date());
    ds7.forEach((ds,i)=>{
      const isPast=ds<_today_check;
      const sh=w&&w.shifts[ds];
      const isRest=!sh;
      // ★ 出勤→お休みに変更された日は、シフトが無くてもチェック欄を出す
      //   （媒体側で「お休みに変更」の入力作業が発生するため）
      const toRest=isChangedToRest(w, ds);
      const showChecks=!isRest||toRest;
      const d=new Date(ds+'T12:00:00');
      const md=`${d.getMonth()+1}/${d.getDate()}`;
      const holiday=isJpHoliday(ds);
      const dcls=holiday?'day-sun':(i===5?'day-sat':i===6?'day-sun':'');
      const dayMemo=(w&&w.dayMemos&&w.dayMemos[ds])||'';
      const kanzen=(w&&w.kanzen&&w.kanzen[ds])||false;
      const vacation=(w&&w.vacations&&w.vacations[ds])||null;
      const vacReq=(w&&w.vacationRequests&&w.vacationRequests.find(r=>r.ds===ds))||null;
      const dayHist=(w&&w.changeHistory&&w.changeHistory[ds])||null;
      const histToRest = dayHist && dayHist.length && !dayHist[dayHist.length-1].after;
      const histIcon = dayHist && dayHist.length
        ? `<div class="day-hist-mark${histToRest?' to-rest':''}" title="変更履歴あり" onclick="event.stopPropagation();StaffApp.showDayHistory('${esc(c.name)}','${wk}','${ds}')">${histToRest?'☑ 休に変更':'🔄 変更'}${dayHist.length>1?'×'+dayHist.length:''}</div>`
        : '';
      const dateCell=`<div class="day-fixed ${isRest?'rest':''} ${vacation?'day-vacation':''}">
        <div class="day-date"><span class="d-md">${md}</span><span class="d-dow ${dcls}">(${dows[i]})</span></div>
        ${vacation
          ? `<div class="vacation-label">🏖️ ${esc(vacation.memo||'休暇')} <span onclick="event.stopPropagation();StaffApp.cancelVacationDay('${esc(c.name)}','${wk}','${ds}')" title="取り消し" style="cursor:pointer;color:#E05260;font-weight:900;margin-left:4px;">✕</span></div>`
          : vacReq
            ? `<div class="vacation-req-label">🏖️ 申請中</div>`
            : sh
              ? `<div class="shift-big">⏰ ${fmtShift(sh.start,sh.end)}${kanzen?'<span class="kanzen-ico"> 完🔵</span>':''}</div>`
              : '<div class="rest-cell">お休み</div>'
        }
        ${histIcon}
        ${(!vacation && !vacReq)
          ? `<div class="day-edit-btn" title="内勤がシフトを変更する" onclick="event.stopPropagation();StaffApp.openShiftEdit('${esc(c.name)}','${wk}','${ds}')">✏️ 変更</div>`
          : ''}
        ${dayMemo?`<div class="day-memo-line">📝 ${esc(dayMemo)}</div>`:''}
      </div>`;

      let bulkCell='';
      if(showChecks){
        const dayStores=allStores.filter(m=>castStores.includes(m) && (!toRest || REST_DAY_STORES.includes(m)));
        const allChecked=dayStores.length>0 && dayStores.every(m=>w.checks[ds+'_'+m]&&w.checks[ds+'_'+m].checked);
        bulkCell=`<div class="bulk-cell"><span class="chk bulk ${allChecked?'checked':''}" style="${allChecked?'background:'+(staffColor(staffName)||'#5FD0A0'):''}"
          title="この日を一括" onclick="StaffApp.toggleDayAll('${esc(c.name)}','${wk}','${ds}')">${allChecked?'✓':''}</span></div>`;
      } else {
        bulkCell='<div class="bulk-cell"></div>';
      }

      let storeCells='';
      if(!showChecks){
        storeCells=`<div class="store-rest">— お休み —</div>`;
      }else{
        const makeChip=(m)=>{
          if(!castStores.includes(m)) return `<div class="store-chip-cell off"><div class="store-chip-name">${esc(STORE_SHORT[m]||m)}</div></div>`;
          // ★ お休みに変更された日は、お休み反映のない媒体をグレーアウト（判定対象からも除外済み）
          if(toRest && !REST_DAY_STORES.includes(m)) return `<div class="store-chip-cell off"><div class="store-chip-name">${esc(STORE_SHORT[m]||m)}</div></div>`;
          const ck=w.checks[ds+'_'+m];
          const checked=ck&&ck.checked;
          const color=checked?(staffColor(ck.by)||'#5FD0A0'):'';
          const updDate=checked&&ck.at?fmtCheckDate(ck.at):'';
          return `<div class="store-chip-cell ${checked?'on':''}">
            <div class="store-chip-name">${esc(STORE_SHORT[m]||m)}</div>
            <span class="chk ${checked?'checked':''}" style="${checked?'background:'+color:''}" title="${checked?esc(ck.by||''):''}"
              onclick="StaffApp.toggleCheck('${esc(c.name)}','${wk}','${ds}','${esc(m)}')">${checked?'✓':''}</span>
            <div class="chk-date">${updDate||'&nbsp;'}</div>
          </div>`;
        };
        const row1=ROW1.map(makeChip).join('');
        const row2=ROW2.map(makeChip).join('');
        storeCells=`<div class="store-grid2"><div class="store-row">${row1}</div><div class="store-row">${row2}</div></div>`;
      }

      rows+=`<div class="check-row ${isRest&&!toRest?'row-rest':''} ${toRest?'row-to-rest':''} ${isRest&&!toRest&&hideRest?'row-hidden':''} ${isPast?'past-day':''}" data-ds="${ds}">${dateCell}${bulkCell}<div class="store-area">${storeCells}</div></div>`;
    });

    const isCurrentWeek = wk===currentWeekKey();
    const alias18=Store.getCastAlias(c.name,'18');
    const aliasGm=Store.getCastAlias(c.name,'極門');
    let aliasBadges='';
    if(aliasGm) aliasBadges+=`<span class="alias-badge gm">極:${esc(aliasGm)}</span>`;
    if(alias18) aliasBadges+=`<span class="alias-badge n18">18:${esc(alias18)}</span>`;
    const staffMemo=(w&&w.staffMemo)||'';
    return `<div class="week-block" data-wk="${wk}">
      <div class="week-head">
        <span class="week-label ${isCurrentWeek?'current':''}">
          <span class="wk-cast-name">${esc(c.name)}</span>${aliasBadges}
          <span class="wk-range">${esc(weekLabel(wk))}</span>
          <span class="badge ${statusBadge(st)}">${statusLabel(st)}</span>
        </span>
        <div class="week-actions">${actions}</div>
      </div>
      ${crInfo}
      <div class="staff-memo-row">
        <span class="staff-memo-label">🗒 内勤メモ</span>
        <input class="staff-memo-input" value="${esc(staffMemo)}" placeholder="このキャストの今週のメモ（キャストには見えません）"
          onchange="StaffApp.saveStaffMemo('${esc(c.name)}','${wk}',this.value)">
      </div>
      <div class="check-rows">${rows}</div>
    </div>`;
  }

  function fmtCheckDate(iso){
    if(!iso) return '';
    const d=new Date(iso);
    if(isNaN(d)) return '';
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  /* ============ 操作 ============ */
  // ★ チェック可否ガード：まだ確認済み通知を送っていない週（waiting）はチェック不可
  function _canCheckWeek(cast, wk){
    const w=Store.getWeek(cast,wk);
    if(!w) return true;
    // waiting（提出済み・確認通知前）／change_requested（変更申請・確認通知前）はチェック前に確認通知が必要
    if(w.status==='waiting' || w.status==='change_requested'){
      _showCheckLockWarning();
      return false;
    }
    return true;
  }
  function _showCheckLockWarning(){
    const existing=document.getElementById('checkLockModal');
    if(existing) return;
    const modal=document.createElement('div');
    modal.id='checkLockModal';
    modal.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.45);';
    modal.innerHTML=`
      <div style="background:#fff;border-radius:20px;padding:26px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)">
        <div style="font-size:38px;margin-bottom:10px">📤</div>
        <div style="font-size:17px;font-weight:900;color:var(--text);margin-bottom:10px">先に確認済み通知を送ってください</div>
        <div style="font-size:13.5px;color:var(--text2);line-height:1.7;margin-bottom:20px">
          このシフトはまだキャストへの確認通知を送っていません。<br><b>「📤 確認済み通知送信」ボタンを押してから</b>、入力チェックができます。
        </div>
        <button id="checkLockClose" style="width:100%;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,#8FD9C0,#3FA88A);color:#fff;font-size:15px;font-weight:900;cursor:pointer">わかりました</button>
      </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#checkLockClose').addEventListener('click',()=>modal.remove());
    modal.addEventListener('click',(e)=>{ if(e.target===modal) modal.remove(); });
  }

  async function toggleCheck(cast, wk, ds, media){
    if(!_canCheckWeek(cast, wk)) return;
    const w=Store.getWeek(cast,wk);
    const cur = w && w.checks[ds+'_'+media] && w.checks[ds+'_'+media].checked;
    const r=Store.dispatch('SET_CHECK',{cast,wk,ds,media,checked:!cur,by:staffName,color:staffColor(staffName)});
    if(r.error){ toast(errorMessage(r.error)); return; }
    renderCastList();
    autoSave();
  }

  /* ★画面の版：ファイル自身の更新日時から自動で決まる（手で書き換える必要なし）
   古いファイルがキャッシュされている場合は古い日時が出るので、
   「誰が古い画面を使っているか」の判別に使える */
const APP_VERSION = (function(){
  try{
    const d = new Date(document.lastModified);
    if(!isNaN(d.getTime())){
      const z = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
    }
  }catch(e){}
  return '不明';
})();
const STORE_ORDER=['記録簿','サクラムーン','ラナ鶯谷','ラナ錦糸町','ドレスガーデン','ピーチムーン','逆AF倶楽部','キューティー','18','極門','ヘブンラナ','ヘブンサクラ','(キュ)ぴゅあらば','(キュ)情報局','(極)ぴゅあらば','(極)情報局'];

  async function toggleDayAll(cast, wk, ds){
    if(!_canCheckWeek(cast, wk)) return;
    const w=Store.getWeek(cast,wk);
    if(!w || (!w.shifts[ds] && !isChangedToRest(w, ds))) return;
    const _toRest = isChangedToRest(w, ds);
    const dayStores=STORE_ORDER.filter(m=>Store.getCastStores(cast).includes(m) && (!_toRest || REST_DAY_STORES.includes(m)));
    if(dayStores.length===0) return;
    // 「残り一括」：未チェックの店舗だけを自分のチェックにする（他人のチェックは触らない）
    const unchecked=dayStores.filter(m=>{ const ck=w.checks[ds+'_'+m]; return !ck || !ck.checked; });
    if(unchecked.length>0){
      // 未チェックがある → 未チェック分を自分のチェックで埋める
      unchecked.forEach(m=>{
        Store.dispatch('SET_CHECK',{cast,wk,ds,media:m,checked:true,by:staffName,color:staffColor(staffName)});
      });
    } else {
      // 全部チェック済み → 自分がチェックした分だけ解除（他人の分は残す）
      dayStores.forEach(m=>{
        const ck=w.checks[ds+'_'+m];
        if(ck && ck.checked && ck.by===staffName){
          Store.dispatch('SET_CHECK',{cast,wk,ds,media:m,checked:false,by:staffName});
        }
      });
    }
    renderCastList();
    autoSave();
  }

  async function fillRemaining(cast, wk){
    if(!_canCheckWeek(cast, wk)) return;
    const w=Store.getWeek(cast,wk);
    if(!w) return;
    const stores=Store.getCastStores(cast).filter(m=>STORES.includes(m));
    let count=0;
    weekDates(wk).forEach(ds=>{
      const _toRest = isChangedToRest(w, ds);
      if(!w.shifts[ds] && !_toRest) return;
      const target = _toRest ? stores.filter(m=>REST_DAY_STORES.includes(m)) : stores;
      target.forEach(m=>{
        const ck=w.checks[ds+'_'+m];
        if(!ck || !ck.checked){
          Store.dispatch('SET_CHECK',{cast,wk,ds,media:m,checked:true,by:staffName,color:staffColor(staffName)});
          count++;
        }
      });
    });
    renderCastList();
    autoSave();
    toast(count>0?count+'件を一括チェックしました✅':'すでに全部チェック済みです');
  }

  /* 一括確定（waitingのみ・change_requestedは対象外） */
  async function bulkConfirmAll(){
    const items=collectInbox().filter(it=>it.type==='submit');
    if(items.length===0){ toast('確認通知を送れる提出がありません'); return; }
    if(!confirm(`受信ボックスの提出済み ${items.length}件 に一括でキャストへ確認通知を送信します。\n変更申請・長期休暇申請は対象外です。\nよろしいですか？`)) return;
    let done=0;
    items.forEach(it=>{
      const r=Store.dispatch('CONFIRM_WEEK',{cast:it.cast,wk:it.wk,by:staffName});
      if(!r.error) done++;
    });
    renderAll();
    await saveNow();
    // 各キャストに通知（まとめて送る）
    items.forEach(it=>{
      StaffGas.notify(it.cast,'done','シフトが確定しました（'+_wkShortRange(it.wk)+'）');
    });
    toast(`${done}件のキャストへ確認通知を送信しました📤`);
  }

  // ★ 提出を受けてキャストへ確認通知を送る（週はロックされる）
  //   変更申請は acceptChange 側で完結するため、ここは通常フロー専用
  async function confirmWeek(cast, wk){
    const r=Store.dispatch('CONFIRM_WEEK',{cast,wk,by:staffName});
    if(r.error){ toast(errorMessage(r.error)); return; }
    renderAll();
    await saveNow();
    const wkRange = _wkShortRange(wk);
    StaffGas.notify(cast,'done','シフトが確定しました（'+wkRange+'）');
    toast(cast+'さんへ確認通知を送信しました📤');
  }

  /* 週キー → "6/1〜6/7" 短縮範囲 */
  function _wkShortRange(wk){
    const ds = weekDates(wk);
    const f=(s)=>{ const d=new Date(s+'T12:00:00'); return `${d.getMonth()+1}/${d.getDate()}`; };
    return f(ds[0])+'〜'+f(ds[6]);
  }

  // ★ 日付セルの🔄マークから、その日の変更履歴を表示
  function showDayHistory(cast, wk, ds){
    const w=Store.getWeek(cast,wk);
    const arr=(w&&w.changeHistory&&w.changeHistory[ds])||[];
    if(!arr.length){ toast('変更履歴がありません'); return; }
    const d=new Date(ds+'T12:00:00');

  /* ---------- 保存 ---------- */
  let _saveTimer=null;
  function autoSave(){
    setSaveState('saving');
    if(_saveTimer)clearTimeout(_saveTimer);
    _saveTimer=setTimeout(async ()=>{
      const ok=await StaffGas.flushNow();
      setSaveState(ok?'saved':'error');
    }, 600);
  }
  async function saveNow(){
    if(_saveTimer){clearTimeout(_saveTimer);_saveTimer=null;}
    setSaveState('saving');
    const ok=await StaffGas.flushNow();
    setSaveState(ok?'saved':'error');
    return ok;
  }
  function setSaveState(s){
    const el=document.getElementById('staffSaveState');
    if(!el)return;
    const map={saved:'✅ 保存済み',saving:'<span class="spinner"></span>保存中…',error:'⏳ 未保存（自動で保存し直しています）'};
    el.innerHTML=map[s]||'✅ 保存済み';
    el.style.color=s==='error'?'#E9A23B':'';
    if(s==='error') _scheduleRetrySave();   // ★ 未保存を放置せず自動で送り直す
  }

  /* ★ 保存できなかった分を自動で再送する
     以前は失敗すると未保存のまま放置され、次に何か操作するまで
     保存されなかった（表示も「失敗」のまま残っていた）。 */
  let _retryTimer = null, _retryCount = 0;
  function _scheduleRetrySave(){
    if(_retryTimer) return;
    _retryTimer = setTimeout(async ()=>{
      _retryTimer = null;
      if(Store.getDirtyKeys().length === 0){ setSaveState('saved'); return; }
      _retryCount++;
      const ok = await StaffGas.flushNow();
      if(ok){
        _retryCount = 0;
        setSaveState('saved');
        if(typeof toast==='function') toast('✅ 保存が完了しました');
      }else if(_retryCount < 6){
        setSaveState('error');   // さらに再試行
      }else{
        _retryCount = 0;
        const el=document.getElementById('staffSaveState');
        if(el){ el.innerHTML='⚠️ 保存できていません（画面を開いたままにしてください）'; el.style.color='#E05260'; }
      }
    }, 5000 * Math.min(_retryCount + 1, 4));
  }

    let _logSearch='';

    function renderLogs(){
      const body=modal.querySelector('#logsBody');
      let logs=_allLogs;
      if(_logFilter!=='all') logs=logs.filter(l=>l.type===_logFilter);
      if(_logStaff!=='all') logs=logs.filter(l=>(l.by||'')===_logStaff);   // ★ 操作した人で絞る
      if(_logSearch) logs=logs.filter(l=>(l.cast||'').includes(_logSearch)||(l.by||'').includes(_logSearch));
      if(logs.length===0){ body.innerHTML='<div style="color:var(--text2);font-size:13px">該当するログはありません</div>'; return; }
      body.innerHTML='';
      /* ★ 見やすさ対策：情報は減らさず「まとめて表示」する
         ・日付ごとに見出しを入れる
         ・同じ人が同じ種類の操作を連続でした分は1行にまとめ、
           ▸を押すと中身（媒体ごとの明細）を全部見られる */
      const groups=[];
      logs.forEach(l=>{
        const g=groups[groups.length-1];
        const t=new Date(l.time).getTime();
        if(g && g.type===l.type && g.by===l.by && g.cast===l.cast && Math.abs(g.t-t)<=120000){
          g.items.push(l);
        }else{
          groups.push({type:l.type, by:l.by, cast:l.cast, week:l.week, t:t, time:l.time, items:[l]});
        }
      });
      let _lastDay='';
      groups.forEach(g=>{
        const l=g.items[0];
        const d=new Date(l.time);
        const dayKey=`${d.getMonth()+1}/${d.getDate()}`;
        if(dayKey!==_lastDay){
          _lastDay=dayKey;
          const wd=['日','月','火','水','木','金','土'][d.getDay()];
          const h=document.createElement('div');
          h.style.cssText='position:sticky;top:0;background:var(--bg,#fff);z-index:1;padding:10px 0 5px;margin-top:6px;font-size:12px;font-weight:800;color:var(--text2);border-bottom:2px solid var(--line)';
          h.textContent=`${dayKey}（${wd}）`;
          body.appendChild(h);
        }
        const dstr=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        // タイプ別の色タグ
        const tagColor = l.type==='CAST_SUBMIT'?'#5FD0A0':l.type==='CONFIRM_WEEK'?'#4A9EE0':l.type==='ACCEPT_CHANGE'?'#E9A23B'
          :(l.type==='DELETE_WEEK'||l.type==='DELETE_CAST'||l.type==='SHIFT_DEL'||l.type==='CHECK_OFF')?'#E05260'
          :l.type==='CHECK_ON'?'#5FD0A0':l.type==='MERGE'?'#B06BD0':l.type==='SAVE_FAILED'?'#E05260':l.type==='LOGIN'?'#B8C2CC'
          :(l.type==='SHIFT_ADD'||l.type==='SHIFT_CHG')?'#4A9EE0':'#999';
        const label=_auditDetail({action:l.type, by:l.by});
        const wkTxt=g.week?`<span style="color:var(--text2);font-size:11px;margin-left:4px">${esc(_wkLabel(g.week))}の週</span>`:'';
        const n=g.items.length;
        const row=document.createElement('div');
        row.style.cssText='padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5';
        const head=`<span style="color:var(--text2);font-size:11px">${dstr}</span> `
          +`<span style="display:inline-block;background:${tagColor};color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;margin:0 4px">${esc(label)}</span> `
          +`<span style="font-weight:800;color:${staffColor(l.by)||'var(--mint-deep)'}">${esc(l.by||'?')}</span>`
          +(l.cast?` → <span style="font-weight:700">${esc(l.cast)}</span>`:'')
          +wkTxt
          +(n>1?` <span style="font-weight:800;color:${tagColor}">${n}件</span>`:'');
        if(n>1){
          // まとめ表示：▸で明細を開く（情報は消さない）
          row.innerHTML=head
            +`<div style="margin-top:3px"><button class="log-more" style="border:none;background:none;color:var(--text2);font-size:11.5px;font-weight:800;cursor:pointer;padding:2px 0">▸ 明細を見る（${n}件）</button>`
            +`<div class="log-detail" style="display:none;color:var(--text2);font-size:12px;margin-top:4px;padding-left:10px;border-left:2px solid var(--line);line-height:1.7">`
            + g.items.map(x=>esc(x.detail||'')).join('<br>') + `</div></div>`;
          const btn=row.querySelector('.log-more'), det=row.querySelector('.log-detail');
          btn.addEventListener('click',()=>{
            const open=det.style.display!=='none';
            det.style.display=open?'none':'block';
            btn.textContent=(open?'▸ 明細を見る（':'▾ 明細を閉じる（')+n+'件）';
          });
        }else{
          row.innerHTML=head
            +(l.detail&&l.detail!==label?`<div style="color:var(--text2);font-size:12px;margin-top:3px;white-space:pre-wrap;line-height:1.5;padding-left:8px">${esc(l.detail)}</div>`:'');
        }
        body.appendChild(row);
      });
    }

    /* 週キー（2026-08-03）を「8/3」に
       ★ スプレッドシートが日付として解釈してしまい、
         「2026-08-02T15:00:00.000Z」のような形で返ることがある。
         その場合は日付として読み直す（そのままだと 8/NaN と表示される）。 */
    function _wkLabel(wk){
      if(!wk) return '';
      const str = String(wk);
      const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(m) return (+m[2])+'/'+(+m[3]);
      const d = new Date(str);
      if(!isNaN(d.getTime())) return (d.getMonth()+1)+'/'+d.getDate();
      return '';
    }

    // 検索・フィルターのイベント
    /* ★ 操作した人で絞り込むチップを作る
       内勤の色をそのまま使うので、誰の操作かが視覚的にも分かる */
    function renderStaffChips(){
      const box=modal.querySelector('#logStaffChips');
      if(!box) return;
      const staff=Store.getStaffList();
      const mk=(label,val,col)=>{
        const on = (_logStaff===val);
        const c = col || 'var(--text2)';
        return `<button class="log-staff-chip" data-ls="${esc(val)}" style="padding:5px 11px;border-radius:99px;border:2px solid ${on?c:'var(--line)'};`
          +`background:${on?c+'22':'#fff'};color:${on?c:'var(--text2)'};font-size:11px;font-weight:800;cursor:pointer">${esc(label)}</button>`;
      };
      // ★ 内勤スタッフのみを並べる（キャストの操作は絞り込み対象にしない）
      let html = mk('すべて','all','#5FD0A0');
      staff.forEach(st=>{ html += mk(st.name, st.name, st.color||'#5FD0A0'); });
      box.innerHTML = html;
      box.querySelectorAll('.log-staff-chip').forEach(b=>{
        b.addEventListener('click',()=>{ _logStaff=b.dataset.ls; renderStaffChips(); renderLogs(); });
      });
    }

    modal.querySelector('#logHelpBtn').addEventListener('click',(ev)=>{ ev.stopPropagation(); openLogHelp(); });
    modal.querySelector('#logsSearch').addEventListener('input',(e)=>{ _logSearch=e.target.value.trim(); renderLogs(); });
    modal.querySelectorAll('.log-filter-chip').forEach(chip=>{
      chip.addEventListener('click',()=>{
        _logFilter=chip.dataset.lf;
        modal.querySelectorAll('.log-filter-chip').forEach(c=>{
          const active=c.dataset.lf===_logFilter;
          c.style.background=active?'var(--mint-deep)':'#fff';
          c.style.color=active?'#fff':'var(--text2)';
          c.style.borderColor=active?'var(--mint)':'var(--line)';
        });
        renderLogs();
      });
    });

    try{
      const r=await StaffGas._get({action:'getLogs'});
      _allLogs=(r&&r.logs)||[];
      renderStaffChips();
      renderLogs();
    }catch(e){
      modal.querySelector('#logsBody').innerHTML='<div style="color:#C62828;font-size:13px">ログの読み込みに失敗しました</div>';
    }
  }

  function setFilter(f){
    filter=f;
    renderFilterChips();
    // 本日入力可能：未入力があるキャストへジャンプ
    if(f==='today'){
      const targets = Store.getCastList().filter(c=>_hasUncheckedToday(c.name))
        .sort((a,b)=>{
          // ★ 未入力が最も早い日付の順（同じ日なら名前順）
          const da=_firstUncheckedDs(a.name)||'9999-12-31';
          const db=_firstUncheckedDs(b.name)||'9999-12-31';
          if(da!==db) return da.localeCompare(db);
          return a.name.localeCompare(b.name,'ja');
        });
      if(targets.length===0){
        renderCastList();
        toast('本日入力可能なキャストはいません✨');
      } else if(targets.length===1){
        // 1人だけ → その人を開いてジャンプ＆キラキラ
        expandedCast = targets[0].name;
        renderCastList();
        setTimeout(()=>{ _jumpToFirstEditable(targets[0].name); }, 150);
      } else {
        // 複数 → 最初の1人だけスクロール＆キラキラ（ガクガク防止）
        // 残りはアコーディオンを開いてキラキラだけ（スクロールで追いかけない）
        expandedCast = targets[0].name;
        renderCastList();
        setTimeout(async ()=>{
          // 先頭だけ月切替＆スクロール
          await _jumpToFirstEditable(targets[0].name);
          // 残りは静かにキラキラ（スクロールなし・月切替なし＝現在表示中の月にいる分だけ）
          for(let i=1;i<targets.length;i++){
            _glowIfVisible(targets[i].name);
          }
          toast(`${targets.length}人に本日入力可能があります（先頭にジャンプしました）`);
        }, 150);
      }
    } else {
      renderCastList();
    }
  }

        </div>
        <div style="font-size:14px;font-weight:800;color:var(--mint-deep);margin-bottom:14px">${esc(cast)}さん　${dateLabel}</div>

        <div style="background:#F8FBF9;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px">

        <input id="seReason" type="text" placeholder="例：本人希望により変更" style="width:100%;padding:11px;border-radius:12px;border:2px solid var(--line);font-family:inherit;font-size:14px;background:#fff;margin-bottom:14px">

        <div style="background:#FFF8FC;border:2px solid #FFE0EC;border-radius:12px;padding:11px 13px;font-size:12px;color:var(--text);line-height:1.7;margin-bottom:16px">

    m.querySelector('#seSave').addEventListener('click',()=>_applyShiftEdit(cast,wk,ds,dateLabel,'time'));

  async function _applyShiftEdit(cast, wk, ds, dateLabel, type){
    const m=document.getElementById('shiftEditModal');
    const reason=(m.querySelector('#seReason').value||'').trim();
    const start=+m.querySelector('#seStart').value;
    const end=+m.querySelector('#seEnd').value;

    if(type==='holiday'){
      if(!confirm(`${cast}さんの ${dateLabel} を「お休み」に変更します。\n\nキャストへ通知が届きます。よろしいですか？`)) return;
    }

    const r = Store.dispatch('STAFF_CHANGE_SHIFT',{
      cast, ds, type, start, end, reason, by: staffName
    });
    if(r && r.error){ toast(errorMessage(r.error)); return; }

    m.remove();
    renderCastList();
    await autoSave();

    // キャストへ通知＋メール
    const beforeTxt = r.before ? fmtShift(r.before.start, r.before.end) : 'お休み';
    const afterTxt  = (type==='holiday') ? 'お休み' : fmtShift(start, end);
    // ★ キャスト側はHTMLタグをそのまま文字として表示するので、装飾せず文章で書く
    const msg = `${dateLabel} のシフトを ${beforeTxt} → ${afterTxt} に変更しました`
      + (reason ? `（${reason}）` : '')
      + `／担当：${staffName||'内勤'}`;
    StaffGas.notify(cast, 'staff_change', msg).catch(()=>{});

    // 操作ログ
    StaffGas._post({action:'addLog', type:'STAFF_EDIT', cast, week:wk,
      detail:`✏️ ${dateLabel} ${beforeTxt} → ${afterTxt}`+(reason?`（${reason}）`:''),
      by: staffName||'内勤'}).catch(()=>{});

    toast(`${dateLabel} を変更し、${cast}さんへ通知しました`);
  }

  /* ============================================================
     人数確認モジュール
     ============================================================ */
  let _staffNotes = {};  // { wk: {remindedCasts:[], memo:''} }
  let _headcountTab = 0; // 0=今週 1=来週 2=再来週

  function _targetWks(){
    return [0,1,2].map(n=>{
      const [y,m,d] = currentWeekKey().split('-').map(Number);
      const date = new Date(y,m-1,d,12,0,0);
      date.setDate(date.getDate()+7*n);
      return ymd(date);
    });
  }

  async function initHeadcount(){
    const wks = _targetWks();
    setBusy(true,'人数データを読み込み中…');
    await Promise.all([
      StaffGas.loadAllWeeks(),   // 全週データ（vacationsを確実に含む）
      (async()=>{ _staffNotes = await StaffGas.loadStaffNotes(wks); })(),
    ]);
    setBusy(false);
    renderHeadcount();
  }

  function renderHeadcount(){
    const cont = document.getElementById('headcountCont');
    if(!cont) return;
    const wks = _targetWks();
    const tabLabels = ['今週','来週','再来週','📅 長期休暇'];
    const tabHtml = tabLabels.map((l,i)=>`
      <button class="hc-tab ${_headcountTab===i?'active':''}" onclick="StaffApp.switchHcTab(${i})">${l}</button>
    `).join('');

    // 長期休暇カレンダータブ
    if(_headcountTab===3){
      cont.innerHTML = `
        <div class="hc-tabs">${tabHtml}</div>
        ${renderVacationCalendar()}`;
      return;
    }

    const wk = wks[_headcountTab];
    const dates = weekDates(wk);
    const notes = _staffNotes[wk] || {remindedCasts:[], dateMemos:{}, memo:''};
    const settings = Store.getSettings();
    const castList = Store.getCastList();

    // 長期休暇中のキャスト（vacationsに対象日がある）
    function getVacationForCast(castName, ds){
      const cwk = weekKeyOf(ds);
      const w = Store.getWeek(castName, cwk);
      return (w && w.vacations && w.vacations[ds]) || null;
    }
    /* ★ 未提出キャストの判定（2026/08/02 修正）
       以前は「その週に1日でも長期休暇があれば週ごと除外」していたため、
       例：7/20まで休暇 → 7/21(火)から出勤できるのに未提出リストに出ず、
       催促されないまま埋もれていた。
       休暇でない日が1日でもあれば「提出が必要な週」として扱う。 */
    function vacationDaysOf(castName){
      return dates.filter(ds => !!getVacationForCast(castName, ds));
    }
    const unsubmitted = castList.filter(c=>{
      const vac = vacationDaysOf(c.name);
      if(vac.length >= dates.length) return false;   // 全日休暇のときだけ除外
      const w = Store.getWeek(c.name, wk);
      return !w || w.status==='unsubmitted';
    });
    // 全日休暇の人だけ「長期休暇中」として扱う（一部休暇の人は未提出側に出す）
    const onVacation = castList.filter(c=> vacationDaysOf(c.name).length >= dates.length);
    // 一部だけ休暇の人（未提出リストに休暇日を添えて表示するため）
    const partialVacation = {};
    castList.forEach(c=>{
      const v = vacationDaysOf(c.name);
      if(v.length > 0 && v.length < dates.length) partialVacation[c.name] = v;
    });

    // シフト時間の短縮ラベル（start-end、翌時間は24引く）
    function shortTime(sh){
      if(!sh || sh.start==null) return '';
      const f=(h)=>h>=24?(h-24):h;
      return `${f(sh.start)}-${f(sh.end)}`;
    }

    // ブロックセルのHTML（人数/必要数、不足は⚠️赤）
    function blockCell(info){
      if(!info || info.min===0) return `<td class="hc-cell hc-cell-none">—</td>`;
      const short = info.shortage>0;
      return `<td class="hc-cell ${short?'hc-cell-short':''}">
        <span class="hc-cell-num">${info.count}</span><span class="hc-cell-min">/${info.min}</span>${short?' ⚠️':''}
      </td>`;
    }

    // テーブルの各行（日付ごと）
    const rows = dates.map(ds=>{
      const biz = getBizOfDay(ds, settings);
      const dateMemo = (notes.dateMemos && notes.dateMemos[ds]) || '';
      const dlabel = fmtDateLabel(ds);
      if(!biz){
        return `<tr class="hc-trow">
          <td class="hc-date-cell">${dlabel}</td>
          <td class="hc-closed-cell" colspan="7">— 休業日 —</td>
        </tr>
        <tr class="hc-memo-trow"><td colspan="8">
          <input class="hc-date-memo" value="${esc(dateMemo)}" placeholder="備考：この日のメモ…" data-ds="${ds}" data-wk="${wk}"
            onchange="StaffApp.saveDateMemo('${wk}','${ds}',this.value)">
        </td></tr>`;
      }
      // 出勤予定（名前(開始-終了)を並べる）
      const working = castList.map(c=>{
        const w=Store.getWeek(c.name,wk);
        if(w && w.shifts && w.shifts[ds] && w.shifts[ds].start!=null){
          return `${c.name}(${shortTime(w.shifts[ds])})`;
        }
        return null;
      }).filter(Boolean);

      const cells = HC_BLOCKS.map(b=>blockCell(hcBlockInfo(b, ds, wk, castList, settings))).join('');
      const noonCell = blockCell(hcNoonStartInfo(ds, wk, castList, settings));
      const lastCell = blockCell(hcLastInfo(ds, wk, castList, settings));

      return `<tr class="hc-trow">
        <td class="hc-date-cell">${dlabel} <span class="hc-zoom" onclick="StaffApp.toggleHcDetail('${ds}')" title="1時間ごとの詳細">🔍</span></td>
        ${cells}
        ${noonCell}
        ${lastCell}
        <td class="hc-plan-cell">${working.length? working.map(w=>`<span class="hc-plan-chip">${esc(w)}</span>`).join('') : '<span class="hc-plan-none">—</span>'}</td>
      </tr>
      <tr class="hc-detail-trow" id="hcdr-${ds}" style="display:none">
        <td colspan="8"><div class="hc-detail-inner">${renderHcHours(ds, wk, castList, settings)}</div></td>
      </tr>
      <tr class="hc-memo-trow"><td colspan="8">
        <input class="hc-date-memo" value="${esc(dateMemo)}" placeholder="備考：この日のメモ…" data-ds="${ds}" data-wk="${wk}"
          onchange="StaffApp.saveDateMemo('${wk}','${ds}',this.value)">
      </td></tr>`;
    }).join('');

    // 未提出一覧
    const unsubHtml = unsubmitted.length===0
      ? '<div class="hc-none">✅ 全員提出済み</div>'
      : `<div class="hc-unsub-chips">${unsubmitted.map(c=>{
          const reminded = (notes.remindedCasts||[]).includes(c.name);
          // ★ 一部だけ長期休暇の人は「いつまで休みか」を添える（催促時の判断材料）
          const pv = partialVacation[c.name];
          let vacTag = '';
          if(pv && pv.length){
            const last = pv[pv.length-1];
            const d = new Date(last+'T12:00:00');
            vacTag = `<span class="hc-unsub-vac">🏖️${d.getMonth()+1}/${d.getDate()}まで休暇</span>`;
          }
          return `<label class="hc-unsub-chip ${reminded?'reminded':''}">
            <input type="checkbox" ${reminded?'checked':''} onchange="StaffApp.toggleRemind('${wk}','${esc(c.name)}',this.checked)">
            ${esc(c.name)}${reminded?' ✓':''}${vacTag}
          </label>`;
        }).join('')}</div>`;

    // 長期休暇中一覧（アコーディオン・デフォルト閉じ）
    const vacHtml = onVacation.length===0 ? '' : `
      <div class="hc-vac-acc">
        <div class="hc-vac-acc-head" onclick="StaffApp.toggleVacAcc()">
          <span>🏖️ 長期休暇中 <span class="hc-unsub-count">${onVacation.length}人</span></span>
          <span id="hcVacArrow" style="transition:transform .2s">▶</span>
        </div>
        <div class="hc-vac-cal" id="hcVacBody" style="display:none;margin-top:10px">
          ${onVacation.map(c=>{
            const vacDays = dates.filter(ds=>!!getVacationForCast(c.name, ds));
            const memo = vacDays.length>0 ? (getVacationForCast(c.name, vacDays[0]).memo||'') : '';
            const dayLabels = vacDays.map(ds=>{
              const d=new Date(ds+'T12:00:00'); return `${d.getMonth()+1}/${d.getDate()}`;
            }).join('・');
            return `<div class="hc-vac-row">
              <span class="hc-cast-name">${esc(c.name)}</span>
              <span class="hc-vac-days">${dayLabels}</span>
              ${memo?`<span class="hc-vac-memo">「${esc(memo)}」</span>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>`;

    cont.innerHTML = `
      <div class="hc-tabs">${tabHtml}</div>

      <div class="hc-section-title" style="margin-top:4px">
        ⚠️ 未提出キャスト <span class="hc-unsub-count">${unsubmitted.length}人</span>
      </div>
      <div class="hc-unsub-list">${unsubHtml}</div>
      ${vacHtml}

      <div class="hc-section-title" style="margin-top:14px">🗒 この週の備考欄</div>
      <div style="display:flex;gap:8px;align-items:flex-start">
        <textarea class="hc-memo" id="hcWeekMemo" placeholder="この週のメモ（内勤のみ）">${esc(notes.memo||'')}</textarea>
        <button class="hc-date-memo-btn" style="white-space:nowrap;padding:10px 14px" onclick="StaffApp.saveHcMemo('${wk}',document.getElementById('hcWeekMemo').value)">保存</button>
      </div>

      <div class="hc-table-title">🕐 時間帯別 在籍人数 <span class="hc-table-sub">${weekLabel(wk)}</span></div>
      <div class="hc-table-wrap">
        <table class="hc-table">
          <thead>
            <tr>
              <th class="hc-th-date">日付</th>
              <th>12-15</th><th>16-19</th><th>20-23</th><th>24-27</th>
              <th>12時<br>出勤</th><th>5時<br>ラスト</th>
              <th class="hc-th-plan">出勤予定</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>

      <div style="margin-top:12px;display:flex;justify-content:flex-end">
        <span style="font-size:11px;color:var(--text2)">📢 出勤募集情報は毎朝9時に自動更新されてキャストに通知されます（この表と同じ集計です）</span>
      </div>`;
  }

  function renderHcHours(ds, wk, castList, settings){
    const mp = getMinPeople(settings);
    const biz = getBizOfDay(ds, settings);
    // 縦棒グラフ（1時間ごと）
    const bars = TIME_ZONES.map(tz=>{
      const outOfHours = biz && (tz.h < biz.open || tz.h >= biz.close);
      const count = castList.filter(c=>{
        const w = Store.getWeek(c.name, wk);
        if(!w || !w.shifts || !w.shifts[ds]) return false;
        return isWorkingAt(w.shifts[ds], tz.h);
      }).length;
      const min = mp[tzMinKey(tz)] || 0;
      const shortage = !outOfHours && min > 0 && count < min;
      const shortLabel = tz.label.replace('時','').replace('(翌5時)','翌5');
      if(outOfHours){
        return `<div class="vbar-col out">
          <div class="vbar-val">–</div>
          <div class="vbar-track"><div class="vbar-fill vbar-out" style="height:4px"></div></div>
          <div class="vbar-label">${shortLabel}</div>
        </div>`;
      }
      // 棒の高さ：必要数を100%基準（最大は必要数の1.5倍で頭打ち）、色で充足判定
      const base = min>0 ? min : Math.max(count,1);
      const pct = Math.min(count/base*70, 100);
      const color = shortage ? 'vbar-short' : (count>=base ? 'vbar-full' : 'vbar-mid');
      return `<div class="vbar-col">
        <div class="vbar-val ${shortage?'vbar-val-short':''}">${count}${min>0?`<span class="vbar-min">/${min}</span>`:''}</div>
        <div class="vbar-track"><div class="vbar-fill ${color}" style="height:${Math.max(pct,6)}%"></div></div>
        <div class="vbar-label">${shortLabel}</div>
      </div>`;
    }).join('');
    return `<div class="vbar-chart">${bars}</div>`;
  }

  function fmtDateLabel(ds){
    const d = new Date(ds+'T12:00:00');
    const dows=['月','火','水','木','金','土','日'];
    const dow=(d.getDay()+6)%7;
    const cls = dow===5?'hc-sat':dow===6?'hc-sun':'';
    return `<span class="${cls}">${d.getMonth()+1}/${d.getDate()}(${dows[dow]})</span>`;
  }

  function switchHcTab(i){
    _headcountTab = i;
    renderHeadcount();
  }

  function toggleHcDetail(ds){
    const el = document.getElementById('hcdr-'+ds);
    if(!el) return;
    el.style.display = el.style.display==='none' ? '' : 'none';
  }

  function toggleVacAcc(){
    const body=document.getElementById('hcVacBody');
    const arrow=document.getElementById('hcVacArrow');
    if(!body) return;
    const open=body.style.display!=='none';
    body.style.display=open?'none':'';
    if(arrow) arrow.style.transform=open?'':'rotate(90deg)';
  }

  async function saveDateMemo(wk, ds, memo){
    const notes = _staffNotes[wk] || {remindedCasts:[], dateMemos:{}, memo:''};
    if(!notes.dateMemos) notes.dateMemos = {};
    notes.dateMemos[ds] = (memo||'').trim();
    _staffNotes[wk] = notes;
    await StaffGas.saveStaffNotes(wk, notes);
    toast('保存しました💾');
  }

  async function updateRecruitInfo(){
    const btn = document.querySelector('.hc-recruit-btn');
    if(btn){ btn.disabled=true; btn.textContent='計算中…'; }
    const settings = Store.getSettings();
    const mp = getMinPeople(settings);
    const castList = Store.getCastList();
    const wks = _targetWks();
    // 来週・再来週の不足時間帯を計算
    const shortages = [];
    [wks[1], wks[2]].forEach(wk=>{
      weekDates(wk).forEach(ds=>{
        const biz = getBizOfDay(ds, settings);
        if(!biz) return;
        const d = new Date(ds+'T12:00:00');
        const dows=['月','火','水','木','金','土','日'];
        const dateLabel=`${d.getMonth()+1}/${d.getDate()}(${dows[(d.getDay()+6)%7]})`;
        TIME_ZONES.forEach(tz=>{
          if(tz.h < biz.open || tz.h >= biz.close) return;
          const min = mp[tzMinKey(tz)] || 0;
          if(!min) return;
          const count = castList.filter(c=>{
            const w = Store.getWeek(c.name, wk);
            return w && w.shifts && w.shifts[ds] && isWorkingAt(w.shifts[ds], tz.h);
          }).length;
          if(count < min) shortages.push({ds, dateLabel, h:tz.h, label:tz.label, shortage:min-count, count, min});
        });
      });
    });
    // GASに保存
    const recruitData = {
      updatedAt: new Date().toISOString(),
      shortages,
    };
    try{
      await StaffGas._post({action:'saveRecruitInfo', data:JSON.stringify(recruitData)});
      toast(`📢 募集情報を更新しました（不足${shortages.length}件）`);
    }catch(e){ toast('更新に失敗しました'); }
    if(btn){ btn.disabled=false; btn.textContent='📢 募集情報を更新してキャストに通知'; }
  }

  /* ============ 長期休暇カレンダー ============ */
  let _vacCalYM = (function(){
    const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  })();

  function renderVacationCalendar(){
    const castList = Store.getCastList();
    const [y,m] = _vacCalYM.split('-').map(Number);
    const days = new Date(y,m,0).getDate();
    const dows = ['日','月','火','水','木','金','土'];

    // 年・月プルダウン別々
    const [selY, selM] = _vacCalYM.split('-').map(Number);
    const yearOpts = [];
    for(let yy=2025; yy<=2028; yy++){
      yearOpts.push(`<option value="${yy}" ${yy===selY?'selected':''}>${yy}年</option>`);
    }
    const monthOpts = [];
    for(let mm=1; mm<=12; mm++){
      monthOpts.push(`<option value="${mm}" ${mm===selM?'selected':''}>${mm}月</option>`);
    }

    // 日付ごとに長期休暇キャストを収集
    const rows = [];
    for(let d=1;d<=days;d++){
      const ds=`${_vacCalYM}-${String(d).padStart(2,'0')}`;
      const date=new Date(y,m-1,d,12,0,0);
      const dow=date.getDay();
      const isHoliday=isJpHoliday(ds);
      const dowCls=dow===0||isHoliday?'hvc-sun':dow===6?'hvc-sat':'';

      // その日に長期休暇受理済みのキャストを収集
      const vacCasts=[];
      castList.forEach(c=>{
        const wk=weekKeyOf(ds);
        const w=Store.getWeek(c.name,wk);
        if(!w||!w.vacations||!w.vacations[ds]) return;
        vacCasts.push({name:c.name, memo:w.vacations[ds].memo||''});
      });

      rows.push(`<div class="hvc-row ${vacCasts.length?'hvc-has-vac':''}">
        <div class="hvc-date ${dowCls}">${m}/${d}(${dows[dow]})</div>
        <div class="hvc-casts">
          ${vacCasts.length
            ? vacCasts.map(v=>`<span class="hvc-cast-chip">${esc(v.name)}${v.memo?'：'+esc(v.memo):''}<span onclick="StaffApp.removeVacation('${esc(v.name)}','${ds}')" style="cursor:pointer;color:#E05260;font-weight:900;margin-left:5px" title="削除">✕</span></span>`).join('')
            : '<span class="hvc-none-day">—</span>'
          }
          <button class="hvc-add-btn" onclick="StaffApp.openVacAdd('${ds}')" title="この日に長期休暇を追加">＋</button>
        </div>
      </div>`);
    }

    return `
      <div class="hvc-header">
        <select class="hvc-ym-sel" onchange="StaffApp.setVacCalY(this.value)">${yearOpts.join('')}</select>
        <select class="hvc-ym-sel" onchange="StaffApp.setVacCalM(this.value)">${monthOpts.join('')}</select>
      </div>
      <div class="hvc-cal">${rows.join('')}</div>`;
  }

  function setVacCalYM(ym){ _vacCalYM=ym; renderHeadcount(); }

  // 内勤が長期休暇を直接追加（日付指定→キャスト選択→理由）
  function openVacAdd(ds){
    const existing=document.getElementById('vacAddModal');
    if(existing) existing.remove();
    const castList=Store.getCastList();
    const d=new Date(ds+'T12:00:00');
    const dows=['日','月','火','水','木','金','土'];
    const dateLabel=`${d.getMonth()+1}/${d.getDate()}(${dows[d.getDay()]})`;
    const modal=document.createElement('div');
    modal.id='vacAddModal';
    modal.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    modal.innerHTML=`
      <div style="position:absolute;inset:0;background:rgba(0,0,0,.4)" id="vacAddBg"></div>
      <div style="position:relative;background:#fff;border-radius:18px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.25);padding:22px">
        <div style="font-size:17px;font-weight:900;color:var(--text);margin-bottom:4px">🏖️ 長期休暇を追加</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:16px">${dateLabel} に長期休暇を登録します</div>
        <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:6px">キャストを選択</div>
        <select id="vacAddCast" style="width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:14px">
          ${castList.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}
        </select>
        <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:6px">理由（任意）</div>
        <input type="text" id="vacAddMemo" placeholder="例：里帰り、療養 など" style="width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:8px;box-sizing:border-box">
        <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:6px">終了日（任意・連続した休暇の場合）</div>
        <input type="date" id="vacAddEnd" value="${ds}" min="${ds}" style="width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:18px;box-sizing:border-box">
        <div style="display:flex;gap:10px">
          <button id="vacAddCancel" style="flex:1;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--text2);font-weight:800;cursor:pointer">キャンセル</button>
          <button id="vacAddSave" style="flex:1;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--mint),var(--mint-deep));color:#fff;font-weight:800;cursor:pointer">追加する</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#vacAddBg').addEventListener('click',()=>modal.remove());
    modal.querySelector('#vacAddCancel').addEventListener('click',()=>modal.remove());
    modal.querySelector('#vacAddSave').addEventListener('click',async ()=>{
      const cast=modal.querySelector('#vacAddCast').value;
      const memo=modal.querySelector('#vacAddMemo').value.trim();
      const endDs=modal.querySelector('#vacAddEnd').value||ds;
      // ds〜endDsの全日付を作る
      const dates=[];
      let cur=new Date(ds+'T12:00:00'); const end=new Date(endDs+'T12:00:00');
      while(cur<=end){ dates.push(ymd(cur)); cur.setDate(cur.getDate()+1); }
      modal.remove();
      // 週ごとにACCEPT_VACATIONを発火
      const byWk={};
      dates.forEach(d2=>{ const wk=weekKeyOf(d2); if(!byWk[wk])byWk[wk]=[]; byWk[wk].push(d2); });
      let ok=true;
      for(const wk in byWk){
        const r=Store.dispatch('ACCEPT_VACATION',{cast, dates:byWk[wk], memo, by:staffName});
        if(r&&r.error){ toast(errorMessage(r.error)); ok=false; }
      }
      if(ok){
        renderHeadcount();
        await saveNow();
        toast(`${cast}さんの長期休暇を追加しました🏖️`);
      }
    });
  }

  // 内勤が長期休暇を削除
  async function removeVacation(cast, ds){
    if(!confirm(`${cast}さんの${ds}の長期休暇を削除しますか？`)) return;
    const wk=weekKeyOf(ds);
    const r=Store.dispatch('CANCEL_VACATION',{cast, wk, dates:[ds]});
    if(r&&r.error){ toast(errorMessage(r.error)); return; }
    renderHeadcount();
    await saveNow();
    toast(`${cast}さんの長期休暇を削除しました`);
  }

  function setVacCalY(y){
    const m=_vacCalYM.split('-')[1];
    _vacCalYM=`${y}-${m}`;
    renderHeadcount();
  }
  function setVacCalM(m){
    const y=_vacCalYM.split('-')[0];
    _vacCalYM=`${y}-${String(m).padStart(2,'0')}`;
    renderHeadcount();
  }

  async function toggleRemind(wk, castName, checked){
    const notes = _staffNotes[wk] || {remindedCasts:[], memo:''};
    const arr = notes.remindedCasts || [];
    if(checked && !arr.includes(castName)) arr.push(castName);
    else if(!checked){ const i=arr.indexOf(castName); if(i>=0) arr.splice(i,1); }
    notes.remindedCasts = arr;
    _staffNotes[wk] = notes;
    await StaffGas.saveStaffNotes(wk, notes);
  }

  async function saveHcMemo(wk, memo){
    const notes = _staffNotes[wk] || {remindedCasts:[], memo:''};
    notes.memo = memo;
    _staffNotes[wk] = notes;
    await StaffGas.saveStaffNotes(wk, notes);
  }

  return {
    init, setStaffName, jumpToCast, toggleCast, openLogs,
    toggleCheck, toggleDayAll, fillRemaining,
    applyStaffSelectColor,
    confirmWeek, bulkConfirmAll, acceptChange, rejectChange, autoConfirmPastWeeks, openShiftEdit, showDayHistory,
    acceptVacation, rejectVacation, cancelVacationDay, openVacAdd, removeVacation,
    sync, changeMonth, setFilter, setSearch, renderAll,
    toggleHideRest, saveStaffMemo,
    initHeadcount, renderHeadcount, switchHcTab, toggleHcDetail, toggleVacAcc,
    toggleRemind, saveHcMemo, saveDateMemo, updateRecruitInfo,
    setVacCalYM, setVacCalY, setVacCalM,
    getViewYM:()=>viewYM,
  };
})();


// ページ切り替え
function switchPage(page){
  const check = document.getElementById('pageCheck');
  const hc = document.getElementById('pageHeadcount');
  const ptCheck = document.getElementById('ptabCheck');
  const ptHC = document.getElementById('ptabHC');
  if(page==='headcount'){
    check.style.display='none'; hc.style.display='';
    ptCheck.classList.remove('active'); ptHC.classList.add('active');
    StaffApp.initHeadcount();
  } else {
    hc.style.display='none'; check.style.display='';
    ptHC.classList.remove('active'); ptCheck.classList.add('active');
  }
}

// 起動
(async function(){
  const ov=document.getElementById('loadingOverlay');
  const txt=document.getElementById('loadingText');
  if(txt)txt.textContent='読み込み中…';
  if(ov)ov.classList.add('show');

  // 認証チェック
  const urlParams = new URLSearchParams(location.search);
  const nameFromUrl = urlParams.get('name') || sessionStorage.getItem('staffName') || '';
  const authOk = sessionStorage.getItem('staffAuth')==='1';
  if(!authOk && location.hostname !== 'localhost' && location.protocol !== 'file:'){
    location.href = 'index.html';
  }

  // ⚙️ 設定画面へ移動（グローバル）
  window.goToSettings = function(){
    const cur = document.getElementById('staffSelect');
    const nm = (cur && cur.value) || sessionStorage.getItem('staffName') || '';
    location.href = 'settings.html' + (nm ? '?name='+encodeURIComponent(nm) : '');
  };

  const monthLbl=document.getElementById('staffMonthLabel');
  const ym=StaffApp.getViewYM().split('-');
  if(monthLbl)monthLbl.textContent=ym[0]+'年 '+Number(ym[1])+'月';

  await StaffApp.init({role:'staff', staffName: nameFromUrl});

  // 過去waitingを自動確定
  await StaffApp.autoConfirmPastWeeks();

  const sel=document.getElementById('staffSelect');
  const staff=Store.getStaffList();
  if(sel){
    /* ★ チェック表で使う内勤ごとの色を、この選択欄にも反映する
       （誰として操作しているかが一目で分かるように） */
    sel.innerHTML=staff.map(s=>
      `<option value="${s.name}" style="color:${s.color||'#5FD0A0'};font-weight:800" ${s.name===nameFromUrl?'selected':''}>${s.name}</option>`
    ).join('')||'<option>内勤</option>';
    if(nameFromUrl) StaffApp.setStaffName(nameFromUrl);
    StaffApp.applyStaffSelectColor();
  }

  // ログアウトボタン
  const logoutBtn2 = document.getElementById('staffLogoutBtn');
  if(logoutBtn2) logoutBtn2.addEventListener('click',()=>{
    sessionStorage.removeItem('staffAuth');
    sessionStorage.removeItem('staffName');
    sessionStorage.removeItem('staffSession');
    location.href='index.html';
  });

  /* ★ 自動ログアウト（2026/08/04 変更）
     30分では業務中に切れてしまうため17時間に延長。
     また、未保存の変更があるときはログアウトしない
     （ログアウトすると未保存の操作が失われるため）。 */
  (function(){
    const IDLE_LIMIT = 17 * 60 * 60 * 1000; // 17時間
    let idleTimer = null;
    function doLogout(){
      // 未保存の変更が残っているうちはログアウトしない
      try{
        if(Store.getDirtyKeys && Store.getDirtyKeys().length > 0){
          resetIdle();          // 保存が終わるまで様子を見る
          return;
        }
      }catch(_){ }
      sessionStorage.removeItem('staffAuth');
      sessionStorage.removeItem('staffName');
      sessionStorage.removeItem('staffSession');
      alert('長時間操作がなかったため、自動ログアウトしました。');
      location.href='index.html';
    }
    function resetIdle(){
      if(idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(doLogout, IDLE_LIMIT);
    }
    ['click','keydown','touchstart','scroll'].forEach(ev=>{
      document.addEventListener(ev, resetIdle, {passive:true});
    });
    resetIdle();
  })();
})();

/* ★ 未保存のまま閉じようとしたら警告する（唯一の実質的なデータ消失を防ぐ） */
window.addEventListener('beforeunload', function(e){
  try{
    if(typeof Store !== 'undefined' && Store.getDirtyKeys && Store.getDirtyKeys().length > 0){
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  }catch(_){ }
});
</script>
